name: Build Stickman 2D Studio ULTRA Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sync latest HTML & Generate App Icon from image in F:/2D
        run: |
          mkdir -p app/src/main/assets
          cp -f stickman_2d_studio.html app/src/main/assets/stickman_2d_studio.html
          cp -f stickman_2d_studio.html app/src/main/assets/index.html
          ICON_SRC=$(find . -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" -o -iname "*.bmp" -o -iname "*.ico" \) | head -n 1)
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "app/src/main/res/$dir"
          done
          if [ -n "$ICON_SRC" ] && command -v convert >/dev/null 2>&1; then
            echo "Using user icon image: $ICON_SRC"
            convert "$ICON_SRC" -resize 48x48! PNG32:app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 72x72! PNG32:app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 96x96! PNG32:app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 144x144! PNG32:app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 192x192! PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp -f "app/src/main/res/$dir/ic_launcher.png" "app/src/main/res/$dir/ic_launcher_round.png"
            done
          elif [ ! -f "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" ] && command -v convert >/dev/null 2>&1; then
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              convert -size 192x192 xc:"#0f172a" -fill "#ef4444" -draw "circle 96,96 96,20" PNG32:"app/src/main/res/$dir/ic_launcher.png"
              cp -f "app/src/main/res/$dir/ic_launcher.png" "app/src/main/res/$dir/ic_launcher_round.png"
            done
          fi

      - name: Direct Fast Android SDK APK Build (Zero Maven Central 429 Rate-Limit!)
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS=$(ls -d "$SDK_DIR/build-tools/"* | sort -V | tail -n 1)
          PLATFORM_JAR=$(ls "$SDK_DIR/platforms/"android-*/android.jar | sort -V | tail -n 1)
          echo "Using BUILD_TOOLS: $BUILD_TOOLS"
          echo "Using PLATFORM_JAR: $PLATFORM_JAR"

          rm -rf build_cli
          mkdir -p build_cli/compiled_res build_cli/gen build_cli/obj build_cli/apk_raw

          "$BUILD_TOOLS/aapt2" compile --dir app/src/main/res -o build_cli/compiled_res/res.zip
          "$BUILD_TOOLS/aapt2" link             -I "$PLATFORM_JAR"             --manifest app/src/main/AndroidManifest.xml             --java build_cli/gen             --min-sdk-version 24             --target-sdk-version 34             --version-code 12             --version-name "12.0-ULTRA-FAST"             -o build_cli/apk_raw/unaligned.apk             build_cli/compiled_res/res.zip             -A app/src/main/assets             --auto-add-overlay

          find app/src/main/java build_cli/gen -name "*.java" > build_cli/sources.txt
          javac -source 17 -target 17 -encoding UTF-8 -cp "$PLATFORM_JAR" -d build_cli/obj @build_cli/sources.txt

          CLASS_FILES=$(find build_cli/obj -name "*.class")
          "$BUILD_TOOLS/d8" --lib "$PLATFORM_JAR" --min-api 24 --output build_cli/apk_raw $CLASS_FILES

          (cd build_cli/apk_raw && zip -q unaligned.apk classes.dex)
          "$BUILD_TOOLS/zipalign" -f -p 4 build_cli/apk_raw/unaligned.apk build_cli/aligned.apk

          keytool -genkeypair -v             -keystore build_cli/debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

          "$BUILD_TOOLS/apksigner" sign             --ks build_cli/debug.keystore             --ks-pass pass:android             --key-pass pass:android             --out Stickman_2D_Studio_ULTRA.apk             build_cli/aligned.apk

          ls -lh Stickman_2D_Studio_ULTRA.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Stickman-2D-Studio-ULTRA-APK
          path: Stickman_2D_Studio_ULTRA.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v3.0-ultra-${{ github.run_number }}
          name: "Stickman 2D Studio ULTRA - Android APK #${{ github.run_number }}"
          files: Stickman_2D_Studio_ULTRA.apk
          prerelease: false
