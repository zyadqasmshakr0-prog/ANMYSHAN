name: Build Stickman 2D Studio ULTRA Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Sync latest HTML into Android Assets
        run: |
          mkdir -p app/src/main/assets
          cp -f stickman_2d_studio.html app/src/main/assets/stickman_2d_studio.html
          cp -f stickman_2d_studio.html app/src/main/assets/index.html

      - name: Build Android APK (Debug & Release)
        run: |
          gradle assembleDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Stickman_2D_Studio_ULTRA.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Stickman-2D-Studio-ULTRA-APK
          path: Stickman_2D_Studio_ULTRA.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v2.0-ultra-${{ github.run_number }}
          name: "Stickman 2D Studio ULTRA - Android APK #${{ github.run_number }}"
          files: Stickman_2D_Studio_ULTRA.apk
          prerelease: false
