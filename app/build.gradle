plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ziyad.stickman2dstudio'
    compileSdk 34

    defaultConfig {
        applicationId "com.ziyad.stickman2dstudio"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "13.0-ULTRA-CITY100-SFX"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
